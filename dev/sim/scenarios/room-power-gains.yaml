name: room-power-gains
description: >
  Two identical home offices with a 400 W PC on weekdays 09-17. Buero meters it with a
  power sensor assigned in RoomMind (power_sensors), Arbeitszimmer runs the same PC
  unmetered. RoomMind learns the device heat (beta_p) in Buero and heats less while the
  PC runs; in Arbeitszimmer the heat surprises the controller and pushes the room above
  its target.
tags: [ekf, mpc, power]
start: 2026-01-12T00:00
duration: 12d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    buero:
      floor_area_m2: 14
      initial: {temperature: 19.0}
      devices: [{entity_id: climate.bu_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.bu_temp}
        power: {entity_id: sensor.bu_pc_power}
    arbeitszimmer:
      floor_area_m2: 14
      initial: {temperature: 19.0}
      devices: [{entity_id: climate.az_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.az_temp}
        power: {entity_id: sensor.az_pc_power}
helpers:
  schedule:
    plan_buero: {weekdays: ["08:00-18:00"], weekend: []}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
  rooms:
    buero:
      devices: [{entity_id: climate.bu_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.bu_temp
      power_sensors: [sensor.bu_pc_power]
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_buero}]
      comfort_temp: 21.0
      eco_temp: 18.0
    arbeitszimmer:
      devices: [{entity_id: climate.az_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.az_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_buero}]
      comfort_temp: 21.0
      eco_temp: 18.0
timeline:
  - {at: "+0d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+0d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+1d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+1d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+2d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+2d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+3d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+3d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+4d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+4d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+7d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+7d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+8d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+8d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+9d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+9d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+10d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+10d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
  - {at: "+11d09h", do: power.set, room: buero, watts: 400, for: 8h}
  - {at: "+11d09h", do: power.set, room: arbeitszimmer, watts: 400, for: 8h}
expect:
  - {metric: model.beta_p_ratio, room: buero, min: 0.7, max: 1.3, label: device heat learned from the power sensor}
  - {metric: model.learned_alpha_per_h, room: buero, min: 0.0145, max: 0.0177, label: loss rate within 10 % of the truth with the PC metered}
  - {metric: model.beta_h_ratio, room: buero, max: 2.2, label: "PC heat not booked on the heating rate (unmetered room 2.41)"}
  - {invariant: target_never_empty}
